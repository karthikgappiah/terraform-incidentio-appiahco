# Every service that can send alerts. The key is the value monitoring tools
# put in metadata.service. owner is a key from teams.yaml.
#
# tier drives incident severity: tier-0 Critical, tier-1 Major, else Minor.
# lifecycle is production or deprecated.

cdn-edge-network:
  owner: cdn
  tier: tier-0
  lifecycle: production

video-transcoding-service:
  owner: streaming
  tier: tier-1
  lifecycle: production

recommendation-engine:
  owner: api
  tier: tier-1
  lifecycle: production

user-profile-api:
  owner: api
  tier: tier-1
  lifecycle: production

user-datastore-postgres:
  owner: databases
  tier: tier-2
  lifecycle: production

legacy-batch-processor-deprecated:
  owner: sre
  lifecycle: deprecated
