# Every team at Netflix. The key is the team's ID in the Catalog (its
# external ID), which alerts and services refer to.
#
# Adding a team here gives it, in one apply:
#   - a Catalog entry, with its aliases and members
#   - an "<Name> on-call" schedule with a weekly rotation
#   - an escalation path built from "Team on-call, then SRE backstop"
#
# SRE is the backstop, so its escalation path is written by hand in escalation.tf.

sre:
  name: SRE
  aliases: []
  members: [karthikgappiah@gmail.com]
  on_call: [karthikgappiah@gmail.com]
  backstop: true

streaming:
  name: Streaming
  aliases: [streaming-infrastructure]
  members: [karthikgappiah@gmail.com]
  on_call: [karthikgappiah@gmail.com]

api:
  name: API
  aliases: [api-platform, ml-platform]
  members: [karthikgappiah@gmail.com]
  on_call: [karthikgappiah@gmail.com]

cdn:
  name: CDN
  aliases: [cdn-infrastructure]
  members: [karthikgappiah@gmail.com]
  on_call: [karthikgappiah@gmail.com]

databases:
  name: Databases
  aliases: [database-platform]
  members: [karthikgappiah@gmail.com]
  on_call: [karthikgappiah@gmail.com]

payments:
  name: Payments
  aliases: [payments-platform]
  members: [karthikgappiah@gmail.com]
  on_call: [karthikgappiah@gmail.com]
